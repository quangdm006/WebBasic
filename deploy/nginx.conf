server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # VitePress bật cleanUrls: /css/grid được phục vụ từ /css/grid.html.
    # $uri/ cho thư mục có index.html, ví dụ bản chạy thử /du-an-mau/.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Tệp trong /assets có mã băm trong tên nên cache được rất lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Endpoint cho readiness/liveness probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
